[package]
name = "mtw-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "mtwRequest server binary — real-time WebSocket framework with AI agents"
keywords = ["server", "websocket", "realtime", "framework", "mtw"]
categories = ["web-programming", "command-line-utilities"]

[[bin]]
name = "mtw-server"
path = "src/main.rs"

[features]
# Default build keeps the binary lean. Opt into the torrent module
# (and its librqbit + axum + tower-http transitive deps) explicitly:
#   cargo build -p mtw-server --features torrent
default = []
torrent = ["dep:mtw-torrent", "mtw-torrent/librqbit-engine"]

[dependencies]
mtw-core = { workspace = true }
mtw-protocol = { workspace = true }
mtw-transport = { workspace = true }
mtw-router = { workspace = true }
mtw-codec = { workspace = true }
mtw-store = { workspace = true }
mtw-bridge = { workspace = true }
mtw-trading = { path = "../mtw-trading", features = ["module"] }
mtw-security = { path = "../mtw-security" }
mtw-ai = { path = "../mtw-ai" }
mtw-whatsapp = { workspace = true }
mtw-net = { workspace = true }
mtw-torrent = { workspace = true, optional = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
seahash = { workspace = true }
dashmap = { workspace = true }
ulid = { workspace = true }
