[package]
name = "mtw-mcp"
# Released independently of the workspace so the MCP can ship faster than
# the rest of the framework. Match this with the `mcp-v*` git tag and the
# npm package.json versions under npm/.
version = "0.4.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "MCP server for Claude Code — manage mtwRequest AI agents: create, run, schedule, chain, group, and trigger."
keywords = ["mcp", "claude", "agents", "ai-tools", "mtw"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mtw-mcp"
path = "src/main.rs"

[features]
# Default keeps the v0.3.x footprint: stdio only, no Rhai. Opt-in:
#   --features http       — streamable HTTP transport (axum)
#   --features code-mode  — Rhai sandbox for `mtw_code_run`
#   --features full       — everything
default = []
http = ["dep:axum", "dep:tower", "dep:futures"]
code-mode = ["dep:rhai"]
full = ["http", "code-mode"]

[dependencies]
mtw-core = { path = "../mtw-core" }
mtw-protocol = { path = "../mtw-protocol" }
mtw-ai = { path = "../mtw-ai" }
mtw-skills = { path = "../mtw-skills" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }

# Optional: HTTP transport
axum = { version = "0.7", features = ["macros"], optional = true }
tower = { version = "0.5", optional = true }
futures = { workspace = true, optional = true }

# Optional: code-mode sandbox
rhai = { version = "1.20", features = ["serde", "sync"], optional = true }
