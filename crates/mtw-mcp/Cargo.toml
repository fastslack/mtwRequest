[package]
name = "mtw-mcp"
# Released independently of the workspace so the MCP can ship faster than
# the rest of the framework. Match this with the `mcp-v*` git tag and the
# npm package.json versions under npm/.
version = "0.3.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "MCP server for Claude Code — manage mtwRequest AI agents: create, run, schedule, chain, group, and trigger."
keywords = ["mcp", "claude", "agents", "ai-tools", "mtw"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mtw-mcp"
path = "src/main.rs"

[dependencies]
mtw-core = { path = "../mtw-core" }
mtw-protocol = { path = "../mtw-protocol" }
mtw-ai = { path = "../mtw-ai" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }
