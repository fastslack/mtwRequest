[package]
name = "mtw-trading"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Trading strategies, signals, and technical analysis formulas for mtwRequest"
keywords = ["trading", "ta", "strategy", "signals", "mtw"]
categories = ["finance", "algorithms"]

[features]
default = []
module = ["async-trait"]  # Enable MtwModule implementation for plugin registration

[dependencies]
mtw-core = { path = "../mtw-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
dashmap = { workspace = true }
rayon = "1"
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
