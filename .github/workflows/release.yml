name: Release

on:
  push:
    tags:
      - 'v*'
  # Rehearsal on a branch: builds every binary and image, publishes nothing
  # (the release and manifest jobs and the image push are tag-only).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # `platform` names the mtw-server / whatsapp-bridge tarballs the
          # way Kernl's packaging/stage-payload.sh downloads them.
          #
          # `server_features` is `--features torrent` on every entry,
          # Windows included: librqbit's SHA1 crate pulls in aws-lc-sys,
          # whose native build needs the NASM assembler to produce Windows
          # (PE) objects (see the Windows-only step below). What was actually
          # proven: `cargo check --target x86_64-pc-windows-gnu -p mtw-server
          # --features torrent`, with nasm installed, inside a Linux
          # container. The matrix below targets x86_64-pc-windows-msvc (the
          # toolchain windows-latest ships) — that combination, including
          # whether NASM resolves the same way for MSVC, is first exercised
          # by a real tagged release run, not by any check so far. Linux and
          # macOS never needed NASM for this feature.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: mtw-request-linux-x64
            platform: linux-x64
            goos: linux
            goarch: amd64
            exe: ''
            server_features: --features torrent
            # Kernl's .deb/.rpm declare glibc >= 2.34 (RHEL 9). A plain build
            # on ubuntu-latest links glibc 2.38+ symbols (__isoc23_strtol from
            # the bundled C code), so mtw-server is built with cargo-zigbuild
            # against this glibc instead, and a guard step checks the result.
            glibc_floor: '2.34'
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: mtw-request-macos-arm64
            platform: darwin-arm64
            goos: darwin
            goarch: arm64
            exe: ''
            server_features: --features torrent
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: mtw-request-macos-x64
            platform: darwin-x64
            goos: darwin
            goarch: amd64
            exe: ''
            server_features: --features torrent
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: mtw-request-windows-x64
            platform: win-x64
            goos: windows
            goarch: amd64
            exe: .exe
            server_features: --features torrent

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: services/whatsapp-bridge/go.sum

      # aws-lc-sys (pulled in transitively by mtw-server's torrent feature,
      # via librqbit's SHA1 crate) needs the NASM assembler to build its
      # optimized crypto for Windows; Linux and macOS runners don't need it.
      - name: Install NASM (needed by aws-lc-sys for the torrent feature)
        if: matrix.goos == 'windows'
        uses: ilammy/setup-nasm@v1

      - name: Build
        if: matrix.goos != 'windows'
        run: cargo build --release --target ${{ matrix.target }}

      # Same feature set as the Docker image (Dockerfile: -p mtw-server
      # --features torrent), so a binary install gets the same server.
      - name: Build mtw-server
        if: '!matrix.glibc_floor'
        run: cargo build --release --target ${{ matrix.target }} -p mtw-server ${{ matrix.server_features }}

      - uses: actions/setup-python@v5
        if: matrix.glibc_floor
        with:
          python-version: '3.12'

      # Versions proven together: a local zigbuild of mtw-server --features
      # torrent with these pins needs at most GLIBC_2.34 and runs on Rocky 9.
      - name: Install cargo-zigbuild
        if: matrix.glibc_floor
        run: pip install cargo-zigbuild==0.23.4 ziglang==0.16.0

      # Own target dir so no object compiled by the system gcc (glibc 2.39
      # headers) can be reused; the binary is then copied to the path the
      # packaging step reads. zig's cc does not search Debian/Ubuntu's
      # multiarch include dir, where opensslconf.h lives, so openssl-sys gets
      # one include dir holding both halves of the OpenSSL headers.
      - name: Build mtw-server (glibc ${{ matrix.glibc_floor }})
        if: matrix.glibc_floor
        shell: bash
        run: |
          set -euo pipefail
          inc="$RUNNER_TEMP/openssl-include"
          mkdir -p "$inc/openssl"
          cp -r /usr/include/openssl/. "$inc/openssl/"
          cp -r /usr/include/x86_64-linux-gnu/openssl/. "$inc/openssl/"
          export OPENSSL_INCLUDE_DIR="$inc" OPENSSL_LIB_DIR=/usr/lib/x86_64-linux-gnu
          CARGO_TARGET_DIR=target/zig cargo zigbuild --release \
            --target "${{ matrix.target }}.${{ matrix.glibc_floor }}" \
            -p mtw-server ${{ matrix.server_features }}
          mkdir -p "target/${{ matrix.target }}/release"
          cp "target/zig/${{ matrix.target }}/release/mtw-server" "target/${{ matrix.target }}/release/mtw-server"

      - name: Check mtw-server glibc floor
        if: matrix.glibc_floor
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/mtw-server"
          floor="GLIBC_${{ matrix.glibc_floor }}"
          max=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest glibc symbol in mtw-server: ${max:-none}"
          if [ -z "$max" ]; then
            echo "::error::no GLIBC_ symbols found in $bin (objdump failed or wrong file)"; exit 1
          fi
          if [ "$(printf '%s\n' "$max" "$floor" | sort -V | tail -1)" != "$floor" ]; then
            echo "::error::mtw-server needs $max, above Kernl's $floor floor"; exit 1
          fi

      # Pure Go (modernc sqlite), so CGO off cross-compiles cleanly — same
      # flags as services/whatsapp-bridge/Dockerfile.
      - name: Build whatsapp-bridge
        working-directory: services/whatsapp-bridge
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/bin-out/whatsapp-bridge${{ matrix.exe }}" .

      - name: Package
        if: matrix.goos != 'windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/libmtw_core.* dist/ 2>/dev/null || true
          cp LICENSE NOTICE dist/
          tar czf ${{ matrix.artifact }}.tar.gz -C dist .

      # One top-level directory per tarball (mtw-server/, whatsapp-bridge/):
      # stage-payload.sh copies that directory into the payload's bin/. On
      # Windows the same directory is zipped instead, since that's the
      # archive format Windows users and Kernl's win-x64 packaging expect.
      - name: Package sidecar binaries
        shell: bash
        run: |
          mkdir -p sidecars/mtw-server sidecars/whatsapp-bridge
          cp target/${{ matrix.target }}/release/mtw-server${{ matrix.exe }} sidecars/mtw-server/
          cp bin-out/whatsapp-bridge${{ matrix.exe }} sidecars/whatsapp-bridge/
          cp LICENSE NOTICE sidecars/mtw-server/
          cp LICENSE NOTICE sidecars/whatsapp-bridge/
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ( cd sidecars && 7z a -tzip -bso0 "../mtw-server-${{ matrix.platform }}.zip" mtw-server )
            ( cd sidecars && 7z a -tzip -bso0 "../whatsapp-bridge-${{ matrix.platform }}.zip" whatsapp-bridge )
          else
            chmod 0755 sidecars/mtw-server/mtw-server sidecars/whatsapp-bridge/whatsapp-bridge
            tar czf mtw-server-${{ matrix.platform }}.tar.gz -C sidecars mtw-server
            tar czf whatsapp-bridge-${{ matrix.platform }}.tar.gz -C sidecars whatsapp-bridge
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Each OS produces only one of the .tar.gz/.zip sidecar pairs, and
          # Windows also skips the top-level ${{ matrix.artifact }}.tar.gz
          # (Build/Package run only off-Windows) — `warn` on missing globs is
          # actions/upload-artifact@v4's default already, so left implicit.
          path: |
            ${{ matrix.artifact }}.tar.gz
            mtw-server-${{ matrix.platform }}.tar.gz
            whatsapp-bridge-${{ matrix.platform }}.tar.gz
            mtw-server-${{ matrix.platform }}.zip
            whatsapp-bridge-${{ matrix.platform }}.zip

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip

  image:
    name: Image ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        arch: [amd64, arm64]
        image: [mtw-request, mtw-whatsapp-bridge]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: mtw-request
            context: .
          - image: mtw-whatsapp-bridge
            context: services/whatsapp-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # A dispatch run (not a tag) only rehearses the build: it gets a
      # placeholder version and pushes nothing.
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/${{ matrix.arch }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: fastslack/${{ matrix.image }}:${{ steps.v.outputs.version }}-${{ matrix.arch }}

  image-manifest:
    name: Image manifests
    needs: image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Merge per-arch images into version and latest
        run: |
          v="${GITHUB_REF_NAME#v}"
          for img in mtw-request mtw-whatsapp-bridge; do
            docker buildx imagetools create \
              -t "fastslack/$img:$v" -t "fastslack/$img:latest" \
              "fastslack/$img:$v-amd64" "fastslack/$img:$v-arm64"
          done
