<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mtwRequest · Orbital Swarm</title>
<style>
  :root{
    --bg: #05060a;
    --panel: rgba(10, 14, 24, .72);
    --line: #1b2740;
    --ink: #d6e1f5;
    --ink-dim: #7a8bad;
    --accent: #7df0ff;
    --warm: #ffd36b;
    --ok: #7dff9f;
    --bad: #ff6b8a;
  }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; overflow:hidden;}
  canvas{display:block}

  .panel{
    position:fixed; padding:14px 18px;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.02);
    font-size:12px; line-height:1.55;
  }
  #hud{ top:18px; left:18px; min-width:238px; }
  #hud h1{
    margin:0 0 10px; font-size:11px; letter-spacing:.22em;
    color:var(--accent); text-transform:uppercase; font-weight:600;
    display:flex; align-items:center; gap:8px;
  }
  #hud h1 .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--accent); box-shadow:0 0 12px var(--accent);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }

  .row{ display:flex; justify-content:space-between; gap:14px; }
  .row span:first-child{ color:var(--ink-dim); }
  .row b{ color:#e8f7ff; font-weight:600; font-variant-numeric: tabular-nums; }
  .row b.accent{ color:var(--accent); }
  .row b.warm{ color:var(--warm); }
  .row b.ok{ color:var(--ok); }
  .row b.bad{ color:var(--bad); }

  #legend{ bottom:18px; left:18px; max-width:260px; font-size:11px; color:var(--ink-dim); line-height:1.65; }
  #legend kbd{
    display:inline-block; padding:1px 6px; border-radius:4px;
    border:1px solid var(--line); background:#0c1220; color:var(--ink);
    font-size:10.5px;
  }
  #brand{ position:fixed; bottom:14px; right:18px; font-size:10.5px;
    color:#4a5777; letter-spacing:.28em; text-transform:uppercase; }
  #brand b{ color:var(--accent); font-weight:600; }

  #flash{
    position:fixed; inset:0; pointer-events:none; opacity:0;
    background: radial-gradient(ellipse at center, rgba(125,240,255,.08), transparent 60%);
    transition: opacity .25s ease-out;
  }
</style>
</head>
<body>

<div id="flash"></div>

<div id="hud" class="panel">
  <h1><span class="dot"></span>Orbital Swarm</h1>
  <div class="row"><span>Connections</span><b id="conns">—</b></div>
  <div class="row"><span>Msg / sec</span><b class="accent" id="mps">—</b></div>
  <div class="row"><span>Pulses / sec</span><b class="warm" id="pps">—</b></div>
  <div class="row"><span>Uptime</span><b id="up">—</b></div>
  <div class="row"><span>Link</span><b id="lnk" class="ok">idle</b></div>
  <div class="row"><span>Frame</span><b id="fps">—</b></div>
</div>

<div id="legend" class="panel">
  <div><kbd>drag</kbd> orbit · <kbd>wheel</kbd> zoom · <kbd>click</kbd> detonate</div>
  <div style="margin-top:6px">every pulse is a WS broadcast from the Rust core;<br>
    waves ripple through the full subscriber snapshot in one syscall per batch.</div>
</div>

<div id="brand"><b>mtwRequest</b> · stress demo</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── tuning ───────────────────────────────────────────────────────────────
const N_PARTICLES = 60000;
const MAX_PULSES  = 16;     // simultaneous pulses the shader tracks
const WAVE_SPEED  = 1.55;   // radians / second
const WAVE_WIDTH  = 0.085;  // ridge halfwidth (radians)
const WAVE_DECAY  = 0.68;   // amplitude decay per second
const SPHERE_R    = 1.5;

// ─── scene ────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060a, 0.05);

const cam = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 100);
cam.position.set(0, 0.6, 4.8);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x05060a, 1);
document.body.appendChild(renderer.domElement);

addEventListener('resize', () => {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const controls = new OrbitControls(cam, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 2.1;
controls.maxDistance = 14;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;

// ─── particle geometry (Fibonacci sphere) ─────────────────────────────────
const positions = new Float32Array(N_PARTICLES * 3);
const ids       = new Float32Array(N_PARTICLES);
const phi0      = Math.PI * (Math.sqrt(5) - 1);
for (let i = 0; i < N_PARTICLES; i++) {
  const y = 1 - (i / (N_PARTICLES - 1)) * 2;
  const r = Math.sqrt(1 - y * y);
  const th = phi0 * i;
  positions[i*3+0] = Math.cos(th) * r;
  positions[i*3+1] = y;
  positions[i*3+2] = Math.sin(th) * r;
  ids[i] = i / N_PARTICLES;
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('aId',      new THREE.BufferAttribute(ids, 1));

// ─── pulses ring buffer ───────────────────────────────────────────────────
const uOrigins = new Float32Array(MAX_PULSES * 3);
const uStarts  = new Float32Array(MAX_PULSES); // -1 = empty
for (let i = 0; i < MAX_PULSES; i++) uStarts[i] = -1;
const uHues    = new Float32Array(MAX_PULSES);
let pulseCursor = 0;

function addPulse(ox, oy, oz, hue, startTime) {
  const slot = pulseCursor % MAX_PULSES;
  uOrigins[slot*3+0] = ox; uOrigins[slot*3+1] = oy; uOrigins[slot*3+2] = oz;
  uStarts[slot]     = startTime;
  uHues[slot]       = (hue % 360 + 360) % 360 / 360;
  pulseCursor++;

  // tiny screen flash on click pulses
  const f = document.getElementById('flash');
  f.style.opacity = '1';
  setTimeout(() => f.style.opacity = '0', 60);
}

// ─── shader material ──────────────────────────────────────────────────────
const mat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:    { value: 0 },
    uRadius:  { value: SPHERE_R },
    uOrigins: { value: uOrigins },
    uStarts:  { value: uStarts  },
    uHues:    { value: uHues    },
    uSpeed:   { value: WAVE_SPEED },
    uWidth:   { value: WAVE_WIDTH },
    uDecay:   { value: WAVE_DECAY },
    uPixel:   { value: renderer.getPixelRatio() },
  },
  vertexShader: /* glsl */`
    attribute float aId;
    uniform float uTime, uRadius, uSpeed, uWidth, uDecay, uPixel;
    uniform vec3  uOrigins[${MAX_PULSES}];
    uniform float uStarts [${MAX_PULSES}];
    uniform float uHues   [${MAX_PULSES}];
    varying vec3  vColor;
    varying float vGlow;
    varying float vFacing;

    vec3 hsv2rgb(vec3 c){
      vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
      vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
      return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
    }

    void main(){
      vec3 n = normalize(position);

      // gentle per-particle jitter so the idle sphere shimmers subtly
      float breath = 0.5 + 0.5 * sin(uTime * 0.7 + aId * 31.4);

      float glow = 0.0;
      // near-black base — with 60k additive points even 0.03 blows out white
      vec3  col  = vec3(0.006, 0.010, 0.022) + vec3(0.010, 0.015, 0.030) * breath;

      for (int i = 0; i < ${MAX_PULSES}; i++){
        float s = uStarts[i];
        if (s < 0.0) continue;
        float age = uTime - s;
        if (age < 0.0 || age > 7.0) continue;

        vec3  o = uOrigins[i];
        float d = acos(clamp(dot(n, o), -1.0, 1.0));  // geodesic distance
        float front = age * uSpeed;
        float ring  = exp(-pow((d - front) / uWidth, 2.0));
        float amp   = exp(-age * uDecay);
        // trailing halo keeps the ridge from looking like a razor-thin line
        float halo  = 0.30 * exp(-pow((d - front) / (uWidth * 2.8), 2.0)) * amp;
        float k = ring * amp + halo;
        glow += k;
        vec3 tint = hsv2rgb(vec3(uHues[i], 0.82, 1.0));
        col += tint * k * 1.9;
      }

      vGlow  = clamp(glow, 0.0, 4.0);
      vColor = col;

      // View-space normal for back-face fade. For a sphere centred at the
      // origin the outward normal equals the position direction.
      vec3 viewN  = normalize((modelViewMatrix * vec4(n, 0.0)).xyz);
      float facing = -viewN.z;                              // +1 front, -1 back
      vFacing = smoothstep(-0.05, 0.35, facing);

      // pop outward on the ridge for parallax
      float push = uRadius * (1.0 + vGlow * 0.05);
      vec4 mv = modelViewMatrix * vec4(n * push, 1.0);
      gl_Position = projectionMatrix * mv;

      // Screen-space point size: stable across zoom, no 60k-point saturation.
      // idle ≈ 1.4 device-px · peak glow ≈ 9 device-px.
      gl_PointSize = (1.2 + vGlow * 2.4) * uPixel * (0.55 + 0.45 * vFacing);
    }
  `,
  fragmentShader: /* glsl */`
    varying vec3  vColor;
    varying float vGlow;
    varying float vFacing;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float r = length(uv);
      if (r > 0.5) discard;
      // soft disk
      float a = smoothstep(0.5, 0.0, r);
      // back-facing particles fade out — otherwise the back hemisphere
      // doubles every pixel's brightness under additive blending.
      a *= vFacing;
      vec3 c = vColor * (0.45 + vGlow * 1.15);
      gl_FragColor = vec4(c * a, a);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});

const points = new THREE.Points(geo, mat);
scene.add(points);

// faint wire sphere behind, gives the eye a scaffold
const wireGeo = new THREE.SphereGeometry(SPHERE_R * 0.996, 48, 24);
const wireMat = new THREE.MeshBasicMaterial({
  color: 0x0e1a33, wireframe: true, transparent: true, opacity: 0.35, depthWrite: false,
});
scene.add(new THREE.Mesh(wireGeo, wireMat));

// ─── HUD wiring ───────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const fmt  = n => (n == null ? '—' : Number(n).toLocaleString('en'));
const fmtT = s => {
  s = Math.floor(s || 0);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return h ? `${h}h ${m}m` : m ? `${m}m ${sec}s` : `${sec}s`;
};

function setLink(state){
  const el = $('lnk');
  el.textContent = state;
  el.className = ({
    'live':'ok','connecting':'warm','closed':'bad','error':'bad','idle':''
  })[state] || '';
}

// ─── WS client ────────────────────────────────────────────────────────────
// URL overrides (so you don't have to edit this file to change the target):
//   swarm_viewer.html?port=17741
//   swarm_viewer.html?host=192.168.1.5&port=17741
//   swarm_viewer.html?ws=ws://some.host:9000/ws   (wins over host+port)
const qp      = new URLSearchParams(location.search);
const host    = qp.get('host') || location.hostname || '127.0.0.1';
const port    = qp.get('port') || '7741';
const wsUrl   = qp.get('ws') || `ws://${host}:${port}/ws`;
console.log('[swarm-viewer] connecting to', wsUrl);
let ws;
function connect(){
  setLink('connecting');
  ws = new WebSocket(wsUrl);
  ws.addEventListener('open',  () => setLink('live'));
  ws.addEventListener('close', () => { setLink('closed'); setTimeout(connect, 900); });
  ws.addEventListener('error', () => setLink('error'));
  ws.addEventListener('message', onWsMsg);
}
connect();

let _sawPulse = false, _sawMetrics = false;
function onWsMsg(e){
  let m;
  try { m = JSON.parse(e.data); } catch { return; }
  // mtwRequest wire: Payload is { kind: "json", data: {...} } due to
  // #[serde(tag="kind", content="data")] on Payload in mtw-protocol.
  const p = m && m.payload;
  if (!p || p.kind !== 'json' || !p.data) return;
  const d = p.data;
  if (d.t === 'pulse') {
    if (!_sawPulse) { console.log('[swarm-viewer] first pulse:', d); _sawPulse = true; }
    addPulse(d.ox, d.oy, d.oz, d.h || 200, nowT());
  } else if (d.t === 'metrics') {
    if (!_sawMetrics) { console.log('[swarm-viewer] first metrics:', d); _sawMetrics = true; }
    $('conns').textContent = fmt(d.conns);
    $('mps'  ).textContent = fmt(d.msgs_per_sec);
    $('pps'  ).textContent = fmt(d.pulses_per_sec);
    $('up'   ).textContent = fmtT(d.uptime_s);
  }
}

// Seed a few offline pulses so the sphere is alive the moment the page
// loads, even before the first server broadcast arrives.
for (let i = 0; i < 4; i++){
  const phi = Math.random() * Math.PI * 2;
  const ct  = Math.random() * 2 - 1;
  const st  = Math.sqrt(1 - ct*ct);
  addPulse(st*Math.cos(phi), st*Math.sin(phi), ct, i * 90, -i * 0.25);
}

// ─── click → local pulse + ask server to broadcast ────────────────────────
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', ev => {
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.x =  ((ev.clientX - rect.left) / rect.width ) * 2 - 1;
  ndc.y = -((ev.clientY - rect.top ) / rect.height) * 2 + 1;
  raycaster.setFromCamera(ndc, cam);
  // intersect ray with unit sphere at origin (we scale in shader, so origins
  // live on the unit sphere)
  const o = raycaster.ray.origin, u = raycaster.ray.direction;
  const b = 2 * o.dot(u);
  const c = o.dot(o) - 1.0;
  const disc = b*b - 4*c;
  if (disc < 0) return;
  const t = (-b - Math.sqrt(disc)) / 2;
  if (t < 0) return;
  const hit = o.clone().add(u.clone().multiplyScalar(t)).normalize();

  const hue = Math.floor(Math.random() * 360);
  addPulse(hit.x, hit.y, hit.z, hue, nowT());

  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify({
      id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
      type: 'event',
      payload: { kind: 'json', data: {
        t: 'click_pulse', ox: hit.x, oy: hit.y, oz: hit.z, h: hue
      }},
      timestamp: Date.now()
    }));
  }
});

// ─── main loop ────────────────────────────────────────────────────────────
const T0 = performance.now() / 1000;
function nowT(){ return performance.now() / 1000 - T0; }

let frameCount = 0, fpsLast = performance.now(), fpsVal = 0;
function tick(){
  const t = nowT();
  mat.uniforms.uTime.value = t;

  // expire stale pulses (shader already skips via age check, but clearing
  // keeps the slot index honest)
  for (let i = 0; i < MAX_PULSES; i++){
    if (uStarts[i] >= 0 && t - uStarts[i] > 7.5) uStarts[i] = -1;
  }

  controls.update();
  renderer.render(scene, cam);

  frameCount++;
  const now = performance.now();
  if (now - fpsLast > 500) {
    fpsVal = Math.round((frameCount * 1000) / (now - fpsLast));
    $('fps').textContent = fpsVal + ' fps';
    frameCount = 0; fpsLast = now;
  }
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
