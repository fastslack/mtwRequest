[workspace]
resolver = "2"
members = [
    "crates/bench-metrics",
    "crates/bench-clients",
    "crates/bench-runner",
    "crates/bench-mtw-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures-util = "0.3"

# Serialization / IO
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
url = "2"

# Errors / logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Metrics
hdrhistogram = "7"
chrono = { version = "0.4", features = ["serde"] }

# Protocol clients
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
rust_socketio = { version = "0.6", features = ["async"] }
async-nats = "0.38"

# Internal crates from main workspace (path deps)
mtw-protocol = { path = "../crates/mtw-protocol" }
mtw-core = { path = "../crates/mtw-core" }
mtw-codec = { path = "../crates/mtw-codec" }
mtw-transport = { path = "../crates/mtw-transport" }
mtw-router = { path = "../crates/mtw-router" }

[profile.release]
lto = "thin"
codegen-units = 1
