# Connection storm: open N connections with limited concurrency.
# Measures per-connect latency (TCP + upgrade/handshake) and aggregate
# connects/second throughput.

scenario: connect

matrix:
  count: [1000, 10000]
  concurrency: 64
  timeout_secs: 60

metrics:
  - connect_latency_p50
  - connect_latency_p99
  - connects_per_sec
  - errors
