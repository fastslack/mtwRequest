[package]
name = "mtw-binding-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "WASM bindings for mtwRequest — browser WebAssembly module"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# wasm-bindgen = "0.2"
# wasm-bindgen-futures = "0.4"
# js-sys = "0.3"
# web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "console"] }
mtw-protocol = { path = "../../crates/mtw-protocol" }
mtw-core = { path = "../../crates/mtw-core" }
mtw-transport = { path = "../../crates/mtw-transport" }
mtw-router = { path = "../../crates/mtw-router" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
