[package]
name = "mtw-binding-node"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "NAPI-RS bindings for mtwRequest — Node.js native addon"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi = { version = "2", features = ["async", "napi8"] }
# napi-derive = "2"
mtw-protocol = { path = "../../crates/mtw-protocol" }
mtw-core = { path = "../../crates/mtw-core" }
mtw-transport = { path = "../../crates/mtw-transport" }
mtw-router = { path = "../../crates/mtw-router" }
mtw-ai = { path = "../../crates/mtw-ai" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures = "0.3"

[build-dependencies]
# napi-build = "2"
