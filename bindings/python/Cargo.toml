[package]
name = "mtw-binding-python"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "PyO3 bindings for mtwRequest — Python native extension"
publish = false

[lib]
name = "mtw_request"
crate-type = ["cdylib"]

[dependencies]
# pyo3 = { version = "0.22", features = ["extension-module"] }
mtw-protocol = { path = "../../crates/mtw-protocol" }
mtw-core = { path = "../../crates/mtw-core" }
mtw-transport = { path = "../../crates/mtw-transport" }
mtw-router = { path = "../../crates/mtw-router" }
mtw-ai = { path = "../../crates/mtw-ai" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
